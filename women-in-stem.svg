<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1a4a"/>
      <stop offset="1" stop-color="#0b2a44"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b388ff"/>
      <stop offset="1" stop-color="#4fc3f7"/>
    </linearGradient>
    <style>
      .float { animation:float 3.5s ease-in-out infinite; }
      .f2 { animation-delay:1.1s } .f3 { animation-delay:2.2s }
      .spin { animation:spin 8s linear infinite; transform-box:fill-box; transform-origin:center; }
      .screen { animation:glow 2.2s ease-in-out infinite; }
      .code { stroke:#4fc3f7; stroke-width:3; stroke-linecap:round; stroke-dasharray:60; animation:type 2.6s ease-in-out infinite; }
      .label { font:700 26px 'Segoe UI',Roboto,Arial,sans-serif; fill:url(#acc); }
      @keyframes float { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-10px) } }
      @keyframes spin { to { transform:rotate(360deg) } }
      @keyframes glow { 0%,100% { opacity:.75 } 50% { opacity:1 } }
      @keyframes type { 0% { stroke-dashoffset:60 } 60%,100% { stroke-dashoffset:0 } }
    </style>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bg2)"/>

  <!-- floating icons -->
  <g class="float" transform="translate(0 0)">
    <g transform="translate(70 80)" class="spin">
      <ellipse cx="0" cy="0" rx="26" ry="9" fill="none" stroke="#b388ff" stroke-width="2.5"/>
      <ellipse cx="0" cy="0" rx="26" ry="9" fill="none" stroke="#b388ff" stroke-width="2.5" transform="rotate(60)"/>
      <ellipse cx="0" cy="0" rx="26" ry="9" fill="none" stroke="#b388ff" stroke-width="2.5" transform="rotate(-60)"/>
      <circle r="4" fill="#4fc3f7"/>
    </g>
  </g>
  <g class="float f2">
    <!-- bar chart -->
    <g transform="translate(305 60)">
      <rect x="0" y="30" width="10" height="20" rx="2" fill="#4fc3f7"/>
      <rect x="15" y="15" width="10" height="35" rx="2" fill="#b388ff"/>
      <rect x="30" y="0" width="10" height="50" rx="2" fill="#4fc3f7"/>
    </g>
  </g>
  <g class="float f3">
    <!-- sparkle / AI -->
    <path transform="translate(330 175)" d="M0 -18 L5 -5 L18 0 L5 5 L0 18 L-5 5 L-18 0 L-5 -5 Z" fill="#b388ff"/>
    <path transform="translate(45 190) scale(.6)" d="M0 -18 L5 -5 L18 0 L5 5 L0 18 L-5 5 L-18 0 L-5 -5 Z" fill="#4fc3f7"/>
  </g>

  <!-- woman at laptop -->
  <g transform="translate(200 215)">
    <!-- hair back -->
    <path d="M-42 -40 C-50 -95 50 -95 42 -40 L46 20 L-46 20 Z" fill="#2b1d3f"/>
    <!-- body -->
    <path d="M-60 95 C-58 40 -35 25 0 25 C35 25 58 40 60 95 Z" fill="url(#acc)"/>
    <!-- neck -->
    <rect x="-9" y="5" width="18" height="24" rx="6" fill="#c98b6b"/>
    <!-- face -->
    <ellipse cx="0" cy="-25" rx="31" ry="36" fill="#d9a07f"/>
    <!-- fringe -->
    <path d="M-33 -35 C-30 -70 30 -72 34 -35 C18 -50 -10 -52 -33 -35 Z" fill="#2b1d3f"/>
    <!-- glasses -->
    <circle cx="-12" cy="-23" r="9" fill="none" stroke="#1a1b33" stroke-width="2.5"/>
    <circle cx="12" cy="-23" r="9" fill="none" stroke="#1a1b33" stroke-width="2.5"/>
    <line x1="-3" y1="-23" x2="3" y2="-23" stroke="#1a1b33" stroke-width="2.5"/>
    <!-- smile -->
    <path d="M-8 -5 Q0 3 8 -5" fill="none" stroke="#7a3e2c" stroke-width="2.5" stroke-linecap="round"/>
      </g>

  <!-- laptop -->
  <g transform="translate(200 300)">
    <rect class="screen" x="-80" y="-10" width="160" height="72" rx="8" fill="#1a1b33" stroke="url(#acc)" stroke-width="3"/>
    <line class="code" x1="-60" y1="10" x2="0" y2="10"/>
    <line class="code" x1="-45" y1="26" x2="40" y2="26" style="animation-delay:.5s"/>
    <line class="code" x1="-60" y1="42" x2="10" y2="42" style="animation-delay:1s"/>
    <rect x="-95" y="62" width="190" height="10" rx="5" fill="#a9a7c8"/>
  </g>

  <text x="176" y="390" text-anchor="middle" class="label">Women in STEM</text>
  <path transform="translate(304 369) scale(1.1)" d="M0 4 C0 -2 8 -4 8 2 C8 -4 16 -2 16 4 C16 10 8 14 8 16 C8 14 0 10 0 4 Z" fill="#b388ff"/>
</svg>
